server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time (via a variable) lets
    # nginx start even if the backend service is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
